name: Build Signed Release APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build signed app-release.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 🔥 核心步骤：生成 keystore 和 key.properties，并在 CI 上验证
      - name: Generate Keystore and Validate Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. 将 Base64 解码为 jks 文件（放在根目录）
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          
          # 2. 检查解码后的文件是否有效
          if [ ! -s keystore.jks ]; then
            echo "❌ 错误：keystore.jks 文件为空！请检查 KEYSTORE_BASE64 是否正确。"
            exit 1
          fi
          
          # 3. 生成 key.properties
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          
          # 4. 🔍 打印 Debug 信息（用于排查）
          echo "---- DEBUG START ----"
          echo "Keystore 文件大小: $(stat -c%s keystore.jks) bytes"
          echo "Key Alias: $KEY_ALIAS"
          echo "Store Password 长度: ${#KEYSTORE_PASSWORD}"
          echo "Key Password 长度: ${#KEY_PASSWORD}"
          
          # 5. 使用 keytool 验证密码是否正确
          if keytool -list -v -keystore keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" > /dev/null 2>&1; then
            echo "✅ Keystore 验证成功！密码和别名完全匹配。"
          else
            echo "❌ 错误：Keystore 验证失败！请检查 KEYSTORE_PASSWORD 和 KEY_PASSWORD 是否正确，或者 KEY_ALIAS 是否匹配。"
            exit 1
          fi
          echo "---- DEBUG END ----"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Use Maven AAPT2 on x86_64 runner
        run: |
          if [ -f gradle.properties ]; then
            sed -i 's/^android\.aapt2FromMavenOverride=.*/# & (disabled in CI: x86_64 runner uses Maven AAPT2)/' gradle.properties
          fi

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error