name: Build Signed Release APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build signed app-release.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # JRE archives are intentionally not checked into git (and *.tar.xz is
      # ignored).  Download the long-lived GitHub Release assets instead of
      # GitHub Actions artifacts: Actions artifacts expire and caused builds to
      # produce an APK with no components/jre-21 asset at all.
      - name: Download and stage bundled JREs (8, 21, 25)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          stage_jre() {
            local version="$1"
            local output="backend/src/main/assets/components/jre-${version}/jre${version}-arm64-v8a.tar.xz"
            local download="${RUNNER_TEMP}/jre${version}-arm64.tar.xz"
            local normalized="${RUNNER_TEMP}/jre${version}-normalized.tar.xz"
            local unpack_dir="${RUNNER_TEMP}/jre${version}-unpacked"
            local url listing top_levels top_count jvm_pattern
            local -a urls=(
              "https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/download_jre${version}/jre${version}-android-arm64.tar.xz"
              "https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/download_jre${version}/jre${version}-android-arm64-v8a.tar.xz"
              "https://github.com/FCL-Team/Android-OpenJDK-Build/releases/download/download_jre${version}/jre${version}-android-arm64.tar.xz"
              "https://github.com/FCL-Team/Android-OpenJDK-Build/releases/download/download_jre${version}/jre${version}-android-arm64-v8a.tar.xz"
            )

            rm -f "$download" "$normalized"
            for url in "${urls[@]}"; do
              echo "Downloading Java ${version}: ${url}"
              if curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
                  --connect-timeout 30 --max-time 1800 \
                  -H "Accept: application/octet-stream" -o "$download" "$url"; then
                break
              fi
              rm -f "$download"
            done
            if [[ ! -s "$download" ]]; then
              echo "Unable to download a release asset for Java ${version}" >&2
              exit 1
            fi

            # Verify the compressed tar before it gets embedded in the APK.
            tar -tJf "$download" >/dev/null
            if [[ "$version" == "8" ]]; then
              jvm_pattern='^(\./)?lib/((aarch64|arm|amd64|i386)/)?server/libjvm\.so$'
            else
              jvm_pattern='^(\./)?lib/server/libjvm\.so$'
            fi

            # Release archives occasionally contain one wrapper directory
            # (for example jre21/...).  JRE.install extracts entries verbatim,
            # so rebuild such archives with bin/ and lib/ at their root.
            listing="$(tar -tJf "$download")"
            if ! grep -Eq "$jvm_pattern" <<<"$listing"; then
              top_levels="$(sed 's#^\./##; s#/.*$##' <<<"$listing" | sed '/^$/d' | sort -u)"
              top_count="$(wc -l <<<"$top_levels" | tr -d ' ')"
              if [[ "$top_count" == "1" ]]; then
                rm -rf "$unpack_dir"
                mkdir -p "$unpack_dir"
                tar -xJf "$download" -C "$unpack_dir" --strip-components=1
                tar -cJf "$normalized" -C "$unpack_dir" .
                mv "$normalized" "$download"
                rm -rf "$unpack_dir"
              fi
            fi

            listing="$(tar -tJf "$download")"
            if ! grep -Eq "$jvm_pattern" <<<"$listing"; then
              echo "Java ${version} archive has no expected lib/server/libjvm.so" >&2
              echo "$listing" | head -40 >&2
              exit 1
            fi
            if [[ "$version" == "8" ]]; then
              grep -Eq '^(\./)?lib/rt\.jar(\.pack)?$' <<<"$listing" || {
                echo "Java 8 archive has no lib/rt.jar or lib/rt.jar.pack" >&2
                exit 1
              }
            else
              grep -Eq '^(\./)?lib/modules$' <<<"$listing" || {
                echo "Java ${version} archive has no lib/modules" >&2
                exit 1
              }
            fi

            mkdir -p "$(dirname "$output")"
            cp "$download" "$output"
            test -s "$output"
            echo "Staged Java ${version}: ${output} ($(du -h "$output" | cut -f1))"
          }

          stage_jre 8
          stage_jre 21
          stage_jre 25

          echo "Bundled JRE assets:"
          find backend/src/main/assets/components -maxdepth 2 -type f \
            -name 'jre*-arm64-v8a.tar.xz' -print | sort

      - name: Decode keystore and write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          
          python3 << 'EOF'
          import os
          with open("key.properties", "w") as f:
              f.write(f"storeFile=../keystore.jks\n")
              f.write(f"storePassword={os.environ.get('KEYSTORE_PASSWORD', '')}\n")
              f.write(f"keyAlias={os.environ.get('KEY_ALIAS', '')}\n")
              f.write(f"keyPassword={os.environ.get('KEY_PASSWORD', '')}\n")
          print("✅ key.properties 已生成，路径指向根目录")
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Use Maven AAPT2 on x86_64 runner
        run: |
          if [ -f gradle.properties ]; then
            sed -i 's/^android\.aapt2FromMavenOverride=.*/# & (disabled in CI: x86_64 runner uses Maven AAPT2)/' gradle.properties
          fi

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify bundled JRE assets are inside the APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$apk" && -s "$apk" ]]
          entries="$(jar tf "$apk")"
          for version in 8 21 25; do
            entry="assets/components/jre-${version}/jre${version}-arm64-v8a.tar.xz"
            if ! grep -Fxq "$entry" <<<"$entries"; then
              echo "Missing ${entry} in ${apk}" >&2
              exit 1
            fi
            echo "APK contains ${entry}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
