      - name: Decode keystore and write key.properties (最终调试版)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          
          python3 << 'EOF'
          import os
          import subprocess

          password = os.environ.get("KEYSTORE_PASSWORD", "")
          alias = os.environ.get("KEY_ALIAS", "")
          keypass = os.environ.get("KEY_PASSWORD", "")

          # 检查文件头
          with open("keystore.jks", "rb") as f:
              header = f.read(4)
          print(f"✅ JKS 文件头: {header.hex()} (正常应为 feedfeed)")
          
          # 打印别名和密码长度（不打印完整密码）
          print(f"✅ 当前传入的别名: '{alias}'")
          print(f"✅ storePassword 长度: {len(password)}, keyPassword 长度: {len(keypass)}")
          
          # 尝试 keytool 验证
          print("正在用 keytool 验证...")
          result = subprocess.run(
              ["keytool", "-list", "-v", "-keystore", "keystore.jks", "-storepass", password, "-alias", alias, "-keypass", keypass],
              capture_output=True, text=True
          )
          
          if result.returncode == 0:
              print("✅✅✅ 验证完美通过！密码和别名完全正确！接下来去打包吧！")
          else:
              print("❌ 验证失败！错误信息如下：")
              print(result.stderr)
              exit(1)
          EOF

          # 使用 Python 写入 key.properties，绝对不破坏特殊字符
          python3 << 'EOF'
          import os
          with open("key.properties", "w") as f:
              f.write(f"storeFile=keystore.jks\n")
              f.write(f"storePassword={os.environ.get('KEYSTORE_PASSWORD', '')}\n")
              f.write(f"keyAlias={os.environ.get('KEY_ALIAS', '')}\n")
              f.write(f"keyPassword={os.environ.get('KEY_PASSWORD', '')}\n")
          print("✅ key.properties 已安全生成")
          EOF